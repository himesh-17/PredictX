version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: motorguard-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: motorguard-ai
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./ml/saved_models:/app/ml/saved_models:ro
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motorguard-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/motorguard
      - AI_SERVICE_URL=http://ai-service:8000/api/v1
    depends_on:
      - mongodb
      - ai-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: motorguard-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
